limit_req_zone $binary_remote_addr zone=api_limit:10m rate=5r/s;
resolver 127.0.0.11 valid=5s ipv6=off;
upstream itadb_api {
    zone itadb_api 64k;
    server api:8000 resolve;
}
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    location /api/ {
        # API documentation loads the FastAPI-provided documentation assets.
        add_header X-Content-Type-Options nosniff always;
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://itadb_api/;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / { try_files $uri $uri/ /index.html; }
}
