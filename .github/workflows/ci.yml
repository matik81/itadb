name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    name: Python and contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.12.17'
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -m 'not integration' --cov=itadb --cov-report=term-missing
      - run: uv run itadb export-openapi && git diff --exit-code -- docs/api/openapi.json
  postgres:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      db:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: itadb_test
          POSTGRES_USER: itadb
          POSTGRES_PASSWORD: test_admin_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U itadb -d itadb_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      ITADB_ADMIN_DATABASE_URL: postgresql://itadb:test_admin_only@localhost:5432/itadb_test
      API_DB_PASSWORD: test_reader_only
      ITADB_TEST_DATABASE_URL: postgresql://itadb:test_admin_only@localhost:5432/itadb_test
      ITADB_TEST_READER_URL: postgresql://itadb_reader:test_reader_only@localhost:5432/itadb_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.12.17'
          enable-cache: true
      - run: uv sync --locked
      - run: uv run python scripts/migrate.py
      - run: uv run python scripts/migrate.py
      - run: uv run pytest -m integration
  web:
    name: Web app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run api:types && git diff --exit-code -- src/generated/api.ts
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build
  compose:
    name: Compose smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker compose config --quiet
      - run: docker compose up --build -d --wait --wait-timeout 180
      - run: docker compose run --rm pipeline itadb ingest-demo
      - run: curl --fail http://localhost:8080/ && curl --fail http://localhost:8080/api/v1/releases
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down
