name: Dependency security
on:
  pull_request:
    paths: ['uv.lock', 'apps/web/package-lock.json', '.github/workflows/security.yml']
  schedule:
    - cron: '37 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.12.17'
      - run: uv sync --locked
      - run: uv run pip-audit --skip-editable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm ci --prefix apps/web && npm audit --prefix apps/web --audit-level=high
