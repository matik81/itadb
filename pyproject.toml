[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "itadb"
version = "0.1.0"
description = "A reproducible, auditable statistical foundation for a synthetic Italian population"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "Apache-2.0"
dependencies = [
  "duckdb>=1.4,<2",
  "fastapi>=0.116,<1",
  "filelock>=3.19,<4",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.10,<3",
  "typer>=0.16,<1",
  "pyshp>=3.1.6,<4",
  "uvicorn[standard]>=0.35,<1",
  "pytz>=2025.2",
]

[project.scripts]
itadb = "itadb.cli:app"

[dependency-groups]
dev = ["pytest>=8.4,<10", "pytest-cov>=6,<8", "ruff>=0.12,<1", "mypy>=1.17,<3", "pip-audit>=2.9,<3"]

[tool.hatch.build.targets.wheel]
packages = ["src/itadb"]

[tool.ruff]
target-version = "py313"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: end-to-end publication and cartography with DuckDB spatial"]
addopts = "-ra"
[tool.mypy]
python_version = "3.13"
strict = true
packages = ["itadb"]
[[tool.mypy.overrides]]
module = ["duckdb.*", "shapefile.*"]
ignore_missing_imports = true
