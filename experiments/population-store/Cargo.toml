[package]
name = "itadb-population-store"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "build-store"
path = "src/main.rs"

[dependencies]
memmap2 = "=0.9.11"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
csv = "=1.4.0"
sha2 = "=0.10.9"
